name: Pages
on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # The download and changelog pages read the releases at build time. A release event runs on the
  # tag, so it only starts a normal run on main (see the `after-release` job).
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests only build (and type-check) the site. Nothing is deployed from them.
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to a pull request replaces its run; builds on main and manual runs never cancel.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Checks over the built site: no third-party origins, no broken links or #anchors, one h1,
      # unique titles, canonical and social tags, structured data.
      - run: npm test
        working-directory: site
      - run: npm run check:built
        working-directory: site
      - run: npm run check:built:negative
        working-directory: site
      # Browser checks on the runner's Chrome: axe (WCAG A/AA, contrast) and a keyboard walk on
      # every page, light and dark, desktop and phone width.
      - run: npm run check:a11y
        working-directory: site
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Lighthouse, mobile settings: fails below 95 for performance, accessibility, best practices, SEO.
      - run: npm run lighthouse
        working-directory: site
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/lighthouse-summary.mjs
        if: always()
        working-directory: site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  # A published release starts a run on main, so the new version shows up without a manual step.
  after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time; a waiting deployment is never cancelled by a pull request build.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
