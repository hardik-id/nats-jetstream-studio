name: Release
# Push a tag such as v0.2.0 to build installers for all three platforms and attach them to the
# GitHub release. Auto-update reads the metadata published next to them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and publish installers
        shell: bash
        run: |
          # Unset signing variables that are empty. GitHub passes a missing secret as an empty string,
          # and electron-builder then reads an empty CSC_LINK as a file path and fails on macOS.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Notarize only when the Apple credentials are configured for this repository.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID" ]; then EXTRA="-c.mac.notarize=true"; fi
          npx electron-builder --publish always $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing. Without these the installers are built unsigned.
          #   Windows and macOS: CSC_LINK (base64 certificate) and CSC_KEY_PASSWORD
          #   macOS notarization: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
