# Installers for the desktop app (PBI-100).
#   npm run build:linux | build:win | build:mac     build for one platform
#   npm run build:unpack                             unpacked folder, for a quick local check
appId: io.github.nats-jetstream-studio
productName: NATS JetStream Studio
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  executableName: nats-jetstream-studio
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: universal
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  # Turned on by the release workflow when the Apple credentials are present.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: NATS JetStream Studio contributors
  category: Development
  synopsis: Browse and manage NATS JetStream
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Releases and update metadata go to the GitHub releases of the repository named in package.json.
publish:
  provider: github
